{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invalid Activation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md text-center">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Invalid or Expired Link</h2>
    <p class="text-gray-600">The activation link is invalid or has expired.</p>
    <a href="{% url 'signup' %}" class="mt-6 inline-block bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition">
        Try Signing Up Again
    </a>
</div>

</body>
</html>
