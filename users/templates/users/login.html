{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Login to Your Account</h2>
    
 <form method="POST" action="{% url 'signup' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="bg-pink-300 hover:bg-pink-400 text-white text-center font-bold py-2 px-4 rounded" type="submit">Log In</button>
</form>
    
    <p class="mt-4 text-center text-gray-600">
        Don't have an account? <a href="{% url 'signup' %}" class="text-indigo-600 hover:underline">Sign Up</a>
    </p>
</div>

</body>
</html>
