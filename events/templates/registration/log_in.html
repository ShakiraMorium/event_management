<!-- templates/registration/login.html -->
<div class="login-container" style="max-width: 400px; margin: auto; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2 style="text-align: center;">Welcome Back</h2>
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            {{ form.as_p }}
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px;">
            Sign In
        </button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">
        Don't have an account? <a href="{% url 'signup' %}">Sign Up</a>
    </p>
</div>
